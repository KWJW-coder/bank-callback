<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Terug naar de app</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 3rem 1rem; }
  a { display: inline-block; margin-top: 1rem; padding: .7rem 1.2rem; border-radius: 10px; background: #0a84ff; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<p>Je wordt teruggestuurd naar de app…</p>
<a id="open" href="familieuitgaven://bank-callback">Open de app</a>
<script>
  // Geeft de query (?code=…&state=…) ongewijzigd door aan de app.
  var target = "familieuitgaven://bank-callback" + window.location.search;
  document.getElementById("open").href = target;
  window.location.replace(target);
</script>
</body>
</html>
